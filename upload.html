  <style>
    :root { --primary-dark: #0f172a; --accent: #0284c7; --danger: #dc2626; --warning: #d97706; --success: #16a34a; --variant-purple: #7c3aed; --sae-badge: #c2410c; --bg: #f8fafc; --border: #cbd5e1; --text: #1e293b; --muted: #64748b; }
    body { background: var(--bg); color: var(--text); padding-bottom: 60px; font-family: sans-serif; }
    .app-header { background: var(--primary-dark); color: white; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; }
    .container { max-width: 1100px; margin: 20px auto; padding: 0 16px; }
    .card { background: white; padding: 22px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; border: 1px solid var(--border); }
    .paste-zone { border: 2.5px dashed var(--accent); padding: 36px 15px; text-align: center; border-radius: 14px; cursor: pointer; background: #f0f9ff; }
    .summary-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 16px 0; }
    .summary-card { background: white; border: 1.5px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; cursor: pointer; }
    .summary-card.active { border-color: var(--primary-dark); background: #f1f5f9; }
    .btn-home { background: var(--accent); color: white; padding: 6px 12px; border-radius: 6px; font-weight: 800; cursor: pointer; border: none; }
    .btn-diff { background: #fffbeb; color: #b45309; border: 1.5px solid #fde68a; padding: 5px 9px; border-radius: 6px; font-size: 11.5px; font-weight: 800; cursor: pointer; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; }
    .modal-box { background: white; width: 960px; max-height: 90vh; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
    .diff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .diff-input { width: 100%; padding: 8px; border: 1px solid var(--border); }
    .is-diff { background: #fffbeb; border-color: #f59e0b; }
    .oem-tbl { width: 100%; border-collapse: collapse; border: 1.5px solid #000; }
    .oem-tbl th, .oem-tbl td { border: 1px solid #000; padding: 6px; }
  </style>
</head>
