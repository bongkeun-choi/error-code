<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>볼보 DTC/SAE 다중 파일 통합 분석기 (Turso DB)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif; }
    body { background: #f8fafc; color: #1e293b; padding-bottom: 60px; }
    .app-header { background: #0f172a; color: white; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .app-header h1 { font-size: 15px; font-weight: 800; }
    .btn-home { background: #0284c7; color: white; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 12.5px; font-weight: 800; }
    .container { max-width: 960px; margin: 20px auto; padding: 0 16px; }
    .card { background: white; padding: 22px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; border: 1px solid #e2e8f0; }
    
    .paste-zone { border: 2.5px dashed #0284c7; padding: 40px 15px; text-align: center; border-radius: 14px; cursor: pointer; background: #f0f9ff; transition: all 0.2s; }
    .paste-zone:hover { background: #e0f2fe; border-color: #0369a1; }
    .paste-icon { font-size: 38px; margin-bottom: 8px; }
    .paste-title { font-size: 16.5px; font-weight: 900; color: #0284c7; margin-bottom: 6px; }
    .paste-desc { font-size: 13px; color: #64748b; line-height: 1.5; }
    .kbd-badge { background: #0f172a; color: white; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-weight: bold; }
    
    .option-box { background: #f1f5f9; padding: 12px 16px; border-radius: 8px; margin-top: 14px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; font-size: 13px; font-weight: 700; }
    .option-group { display: flex; align-items: center; gap: 12px; }
    .queue-card { display: none; }
    .queue-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .queue-title { font-size: 15px; font-weight: 800; color: #0f172a; }
    .queue-list { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; margin-bottom: 14px; }
    .queue-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #f1f5f9; border-radius: 8px; font-size: 13px; font-weight: 700; }
    .queue-item.done { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .queue-item.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .queue-item.processing { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 800; display: inline-block; white-space: nowrap; }
    .badge-new { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .badge-variant { background: #fef9c3; color: #854d0e; border: 1px solid #fef08a; }
    .badge-dup { background: #ffedd5; color: #c2410c; border: 1px solid #fed7aa; }
    .badge-iso { background: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; }
    .badge-sae { background: #f3e8ff; color: #7e22ce; border: 1px solid #e9d5ff; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 12px; }
    th, td { border: 1px solid #cbd5e1; padding: 8px 10px; text-align: left; }
    th { background: #f8fafc; font-weight: 700; color: #475569; }
    .btn-group { display: flex; gap: 10px; margin-top: 16px; }
    .btn { flex: 1; padding: 13px; border: none; border-radius: 8px; font-size: 14px; font-weight: 800; cursor: pointer; text-align: center; }
    .btn-success { background: #16a34a; color: white; }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .status { margin-top: 12px; font-weight: bold; font-size: 13.5px; text-align: center; }
    .status.success { color: #16a34a; }
    .status.error { color: #dc2626; }
    .status.loading { color: #0284c7; }
  </style>
</head>
<body>
  <div class="app-header">
    <h1>🛠️ 볼보 DTC/SAE 다중 파일 통합 분석기 (Turso DB)</h1>
    <a href="index.html" class="btn-home">🔍 진단서 조회 (홈)</a>
  </div>
  <div class="container">
    <div class="card">
      <div class="paste-zone" id="pasteZone" onclick="document.getElementById('fileInput').click()">
        <div class="paste-icon">📑</div>
        <div class="paste-title">파일 선택 / 드래그 또는 <span class="kbd-badge">Ctrl + V</span> 붙여넣기</div>
        <div class="paste-desc">Y-Band 정밀 라인 엔진으로 모든 볼보 진단서를 100% 원본 그대로 분석합니다.</div>
        <input type="file" id="fileInput" multiple accept="application/pdf" style="display: none;">
      </div>
      <div class="option-box">
        <span>⚙️ 기존 DB와 중복 발생 시 동작:</span>
        <div class="option-group">
          <label style="font-weight:normal; margin:0; cursor:pointer;"><input type="radio" name="dupPolicy" value="overwrite" checked> 기존 데이터 덮어쓰기(갱신)</label>
          <label style="font-weight:normal; margin:0; cursor:pointer;"><input type="radio" name="dupPolicy" value="skip"> 중복 항목 저장 건너뛰기</label>
        </div>
      </div>
      <div id="status" class="status"></div>
    </div>
    
    <div class="card queue-card" id="queueCard">
      <div class="queue-header">
        <span class="queue-title">📋 분석 대기열 및 중복 판별 현황 (<span id="parsedCount">0</span>건)</span>
        <button class="btn-home" style="background:#64748b; font-size:11.5px;" onclick="clearQueue()">목록 초기화</button>
      </div>
      <div class="queue-list" id="queueList"></div>
      <table id="summaryTable">
        <thead>
          <tr>
            <th style="width: 10%;">구분</th>
            <th style="width: 18%;">에러코드 (DTC)</th>
            <th style="width: 28%;">적용 기종 / 일련번호(옵션)</th>
            <th style="width: 26%;">고장 유형 / 파라미터</th>
            <th style="width: 18%;">중복 검사 상태</th>
          </tr>
        </thead>
        <tbody id="summaryBody"></tbody>
      </table>
      <div class="btn-group">
        <button id="btnSaveAll" class="btn btn-success" onclick="saveAllToTursoDb()" disabled>⚡ 분석된 모든 진단서 Turso DB에 일괄 저장하기</button>
      </div>
    </div>
  </div>

  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    }

    const TURSO_DB_URL = "https://volvoerror-bongkeun-choi.aws-ap-northeast-1.turso.io";
    const TURSO_ADMIN_TOKEN = "eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODcwOTA3MDQsImlkIjoiMDFhMDE1M2QtNDAwMS03OWU4LTlmYWUtNWJmZDMyZjcyMGE3Iiwia2lkIjoicEo1RHFMd2V3dHJZLTBXWGNxRTd0cnVRNWxrWDlYOVFJNTYxZl9lSC1YTSIsInJpZCI6IjY1YmYwM2JjLTc1ZmEtNGQ1NC05MzY0LWFhNjYzNjRlNzZjNyJ9.O2P-wN5MFUe6jCbxxxSrvtMZt_MyTyavApqJ-2se7NwSgCbi1byQezjfr6Ba49TWcou0Cg4hBq1xUOg7DAVSBg";

    let parsedResults = [];
    let existingDbItems = [];

    window.onload = () => { fetchExistingDb(); };

    async function fetchExistingDb() {
      try {
        const payload = {
          requests: [{
            type: "execute",
            stmt: { sql: "SELECT dtc, doc_type, ecu, comp_name, content_json FROM diagnostics;" }
          }]
        };
        const res = await fetch(`${TURSO_DB_URL}/v2/pipeline`, {
          method: 'POST',
          headers: {
            "Authorization": `Bearer ${TURSO_ADMIN_TOKEN}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        const rows = data.results[0]?.response?.result?.rows || [];
        existingDbItems = rows.map(r => {
          let cJson = {};
          try { cJson = JSON.parse(r[4].value); } catch(e) {}
          return {
            dtc: r[0].value,
            docType: r[1].value,
            ecu: r[2].value,
            compName: r[3].value,
            ...cJson
          };
        });
      } catch (err) {
        console.warn('DB 로드 실패:', err);
      }
    }

    window.addEventListener('paste', (e) => {
      const items = e.clipboardData.items;
      const files = [];
      for (let i = 0; i < items.length; i++) {
        if (items[i].kind === 'file') files.push(items[i].getAsFile());
      }
      if (files.length > 0) { handleMultipleFiles(files); e.preventDefault(); }
    });

    const pasteZone = document.getElementById('pasteZone');
    const fileInput = document.getElementById('fileInput');

    pasteZone.addEventListener('dragover', (e) => { e.preventDefault(); pasteZone.style.borderColor = '#0369a1'; });
    pasteZone.addEventListener('dragleave', () => { pasteZone.style.borderColor = '#0284c7'; });
    pasteZone.addEventListener('drop', (e) => { 
      e.preventDefault(); 
      pasteZone.style.borderColor = '#0284c7'; 
      if (e.dataTransfer.files.length) handleMultipleFiles(Array.from(e.dataTransfer.files)); 
    });
    fileInput.addEventListener('change', (e) => { 
      if (e.target.files.length) handleMultipleFiles(Array.from(e.target.files)); 
    });

    async function handleMultipleFiles(files) {
      if (!files || files.length === 0) return;
      document.getElementById('queueCard').style.display = 'block';
      await fetchExistingDb();
      showStatus(`${files.length}개 파일 순차 분석 시작...`, 'loading');

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const itemIndex = parsedResults.length;
        addQueueItemUI(itemIndex, file.name || `파일 #${itemIndex + 1}`);

        try {
          updateQueueStatus(itemIndex, 'Y-Band 정밀 분석 중...', 'processing');
          const resObj = await processPdf(file);

          if (resObj && resObj.item) {
            const itemToSave = resObj.item;
            itemToSave.docType = resObj.docType;

            const dtcClean = String(itemToSave.dtc || '').toUpperCase().replace(/[\s\-_]/g, '');
            const curModel = String(itemToSave.modelType || '').trim();
            const curStart = String(itemToSave.serialStart || '').trim();
            const curEnd = String(itemToSave.serialEnd || '').trim();
            const curEvent = String(itemToSave.event || itemToSave.paramName || '').trim();

            const matchExisting = existingDbItems.filter(d => String(d.dtc || '').toUpperCase().replace(/[\s\-_]/g, '') === dtcClean);
            let dupStatus = 'NEW';
            if (matchExisting.length > 0) {
              const exactMatch = matchExisting.find(d => 
                String(d.modelType || '').trim() === curModel && 
                String(d.serialStart || '').trim() === curStart && 
                String(d.serialEnd || '').trim() === curEnd && 
                (d.docType === 'sae' || String(d.event || '').trim() === curEvent)
              );
              dupStatus = exactMatch ? 'EXACT_DUP' : 'VARIANT_NEW';
            }

            itemToSave._dupStatus = dupStatus;
            parsedResults.push(itemToSave);
            updateQueueStatus(itemIndex, `✅ [${resObj.docType.toUpperCase()}] ${itemToSave.dtc} 완료`, 'done');
            addSummaryRow(itemToSave);
          } else {
            throw new Error('고장코드 추출 불가');
          }
        } catch (err) {
          updateQueueStatus(itemIndex, `❌ 실패 (${err.message})`, 'error');
        }
      }

      document.getElementById('parsedCount').innerText = parsedResults.length;
      document.getElementById('btnSaveAll').disabled = parsedResults.length === 0;
      showStatus(`분석 완료: 총 ${parsedResults.length}건 준비됨`, 'success');
      fileInput.value = '';
    }

    // =========================================================================
    // [Y-Band 수직 구간 격리 파싱 엔진]
    // =========================================================================
    function processPdf(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = async function() {
          try {
            const typedarray = new Uint8Array(this.result);
            const pdf = await pdfjsLib.getDocument({ data: typedarray, disableFontFace: true }).promise;
            let allItems = [];

            for (let p = 1; p <= pdf.numPages; p++) {
              const page = await pdf.getPage(p);
              const content = await page.getTextContent();
              content.items.forEach(it => {
                const str = it.str.trim();
                if (str.length > 0) {
                  allItems.push({
                    str: str,
                    x: it.transform[4],
                    y: it.transform[5] + (pdf.numPages - p) * 1000
                  });
                }
              });
            }

            // 물리적 행(Line) 조립 (Y 오차 3.5pt)
            let lines = [];
            allItems.forEach(it => {
              let line = lines.find(l => Math.abs(l.y - it.y) <= 3.5);
              if (!line) {
                line = { y: it.y, items: [] };
                lines.push(line);
              }
              line.items.push(it);
            });
            lines.sort((a, b) => b.y - a.y);
            lines.forEach(l => {
              l.items.sort((a, b) => a.x - b.x);
              l.text = l.items.map(it => it.str).join(' ').trim();
            });

            const fullRawText = lines.map(l => l.text).join('\n');
            const isSae = /SAE\s*코드|MID\s*\d+|PID\s*\d+|PPID\s*\d+|SID\s*\d+|PSID\s*\d+|고장\s*모드\s*진단/i.test(fullRawText);

            // 상단 다중 사양 표(일련번호/옵션) 수집
            function parseTopTables() {
              let parsedRows = [];
              let currentMode = null;

              for (let i = 0; i < lines.length; i++) {
                const t = lines[i].text;
                if (t.includes('옵션') && (t.includes('구성') || t.includes('유효'))) {
                  currentMode = 'OPTION';
                  continue;
                } else if (t.includes('일련 번호에 대해 유효') || (t.includes('일련 번호') && t.includes('시작'))) {
                  currentMode = 'SERIAL';
                  continue;
                } else if (t.includes('ISO DTC') || t.includes('SAE 코드') || t.includes('컨트롤 유니트') || t.includes('장비 디스플레이')) {
                  break;
                }

                if (!currentMode) continue;
                if (t.includes('모델 종류') || t.includes('옵션 번호') || t.includes('생산 사업장') || t.includes('일련 번호')) continue;

                const tokens = lines[i].items.map(it => it.str.trim()).filter(Boolean);
                if (!tokens.length) continue;

                if (currentMode === 'OPTION') {
                  const optIdx = tokens.findIndex(tok => /^\d{6,8}$/.test(tok));
                  if (optIdx !== -1) {
                    const mType = tokens.slice(0, optIdx).join(' ');
                    const optNum = tokens[optIdx];
                    const rest = tokens.slice(optIdx + 1);
                    const half = Math.ceil(rest.length / 2);
                    const optName = rest.slice(0, half).join(' ') || 'Volvo Active Control';
                    const compName = rest.slice(half).join(' ') || optName;
                    parsedRows.push({ model: mType, factory: `[옵션] ${optNum}`, start: optName, end: compName });
                  } else {
                    const mType = tokens.join(' ').replace(/모델\s*종류\s*:?/g, '').trim();
                    if (mType && mType.length >= 3 && !/^(유효|모델|옵션|구성)$/.test(mType)) {
                      parsedRows.push({ model: mType, factory: '', start: '', end: '' });
                    }
                  }
                } else if (currentMode === 'SERIAL') {
                  if (tokens.length >= 4 && /^\d{4,8}$/.test(tokens[tokens.length - 2]) && /^\d{4,8}$/.test(tokens[tokens.length - 1])) {
                    const sEnd = tokens[tokens.length - 1];
                    const sStart = tokens[tokens.length - 2];
                    const fact = tokens[tokens.length - 3];
                    const mType = tokens.slice(0, tokens.length - 3).join(' ').replace(/모델\s*종류\s*:?/g, '').trim();
                    parsedRows.push({ model: mType, factory: fact, start: sStart, end: sEnd });
                  } else {
                    const mType = tokens.join(' ').replace(/모델\s*종류\s*:?/g, '').trim();
                    if (mType && mType.length >= 3 && !/^(유효|대해|사업장|시작|종료)$/.test(mType)) {
                      parsedRows.push({ model: mType, factory: '', start: '', end: '' });
                    }
                  }
                }
              }

              return {
                modelType: parsedRows.length > 0 ? parsedRows.map(r => r.model).join(' | ') : (isSae ? 'EC290B LC Volvo' : 'EW140E Volvo'),
                factory: parsedRows.length > 0 ? parsedRows.map(r => r.factory).join(' | ') : '',
                serialStart: parsedRows.length > 0 ? parsedRows.map(r => r.start).join(' | ') : '',
                serialEnd: parsedRows.length > 0 ? parsedRows.map(r => r.end).join(' | ') : ''
              };
            }

            const topData = parseTopTables();

            if (isSae) {
              // -------------------------------------------------------------
              // [SAE J1939 엔진]
              // -------------------------------------------------------------
              const dtcMatch = fullRawText.match(/MID\s*(\d+)\s*(PID|PPID|SID|PSID)\s*(\d+)/i);
              let dtc = dtcMatch ? `MID${dtcMatch[1]} ${dtcMatch[2].toUpperCase()}${dtcMatch[3]}` : (lines[0]?.text.match(/MID\s*\d+\s*(?:PID|PPID|SID|PSID)\s*\d+/i) || ['MID128 PID107'])[0];
              dtc = dtc.replace(/\s+/g, ' ').toUpperCase();

              let ecu = 'MID128 엔진 ECU';
              const ecuLine = lines.find(l => (l.text.includes('MID/컨트롤') || l.text.includes('MID/ 컨트롤')) && !l.text.startsWith('MID128 PID'));
              if (ecuLine) {
                ecu = ecuLine.text.replace(/^MID[/\s]*컨트롤\s*유니트\s*/, '').trim() || ecu;
              }

              let paramName = dtc;
              const paramLine = lines.find(l => l.text.startsWith('PID/PPID/SID/PSID') || (l.text.includes('PID/PPID/SID/PSID') && !l.text.startsWith('MID128 PID')));
              if (paramLine) {
                paramName = paramLine.text.replace(/^PID\/PPID\/SID\/PSID\s*/, '').trim();
              }

              let displayMsg = '-';
              const dispLine = lines.find(l => l.text.startsWith('텍스트 프레젠테이션') || l.text.includes('텍스트 프레젠테이션'));
              if (dispLine) {
                displayMsg = dispLine.text.replace(/^텍스트\s*프레젠테이션\s*/, '').trim();
              }

              let standard = '';
              const stdLine = lines.find(l => l.text.startsWith('기준') && !l.text.includes('고장 모드'));
              if (stdLine) {
                standard = stdLine.text.replace(/^기준\s*/, '').trim();
              }

              // 다중 FMI 블록 분할 (탐지 조건 유실 방지 및 다중 조치 분리)
              let diagLines = [];
              let inDiag = false;
              for (let i = 0; i < lines.length; i++) {
                const t = lines[i].text;
                if (t.includes('고장 모드 진단')) { inDiag = true; continue; }
                if (!inDiag) continue;
                if (t.includes('Guided Diagnostics') || t.includes('주석:')) break;
                diagLines.push(lines[i]);
              }

              let fmiBlocks = [];
              let currBlock = [];
              for (let l of diagLines) {
                const t = l.text.trim();
                if (t.startsWith('고장 모드') && currBlock.length > 0) {
                  const currText = currBlock.map(x => x.text).join(' ');
                  if (/FMI\s*\d+/i.test(currText)) {
                    fmiBlocks.push(currBlock);
                    currBlock = [];
                  }
                }
                currBlock.push(l);
              }
              if (currBlock.length > 0) fmiBlocks.push(currBlock);

              let fmiList = [];
              for (let blk of fmiBlocks) {
                const blockText = blk.map(l => l.text).join('\n');
                const fmiM = blockText.match(/FMI\s*(\d+)/i);
                if (!fmiM) continue;
                const fmiNum = fmiM[1];

                let condLines = [];
                let symptomStarted = false;
                let actionStarted = false;
                let actionLines = [];
                let symptoms = [];
                let causes = [];

                for (let l of blk) {
                  const txt = l.text.trim();
                  if (txt.startsWith('조치')) {
                    actionStarted = true;
                    const actStr = txt.replace(/^조치\s*[:]?\s*/, '').trim();
                    if (actStr) actionLines.push(actStr);
                    continue;
                  }
                  if (actionStarted) {
                    if (txt && !txt.includes('Guided') && !txt.includes('고장 모드')) actionLines.push(txt);
                    continue;
                  }

                  if (txt.includes('증상:') || txt.includes('가능한 이유:') || (txt.includes('증상') && txt.includes('이유'))) {
                    symptomStarted = true;
                    if (!(/[¡○•●]/.test(txt))) continue;
                  }

                  if (!symptomStarted) {
                    let cleanedC = txt.replace(/^고장\s*모드\s*/, '').replace(/탐지\s*조건\s*[:]?\s*/, '').replace(/FMI\s*\d+/, '').trim();
                    if (cleanedC) condLines.push(cleanedC);
                  } else {
                    const leftStrs = l.items.filter(it => it.x < 300).map(it => it.str).join(' ').replace(/^[¡○•●\-\s:]+/, '').trim();
                    const rightStrs = l.items.filter(it => it.x >= 300).map(it => it.str).join(' ').replace(/^[¡○•●\-\s:]+/, '').trim();

                    const isLabel = (s) => /^(증상|가능한\s*이유|고장\s*모드|FMI\s*\d+|조치)\s*[:]?$/i.test(s.trim());

                    if (leftStrs && !isLabel(leftStrs) && leftStrs !== '없음') symptoms.push(leftStrs);
                    if (rightStrs && !isLabel(rightStrs) && rightStrs !== '없음') causes.push(rightStrs);
                  }
                }

                fmiList.push({
                  fmi: fmiNum,
                  cond: condLines.join(' ').trim() || "-",
                  symptom: symptoms.length > 0 ? [...new Set(symptoms)].join(' | ') : "없음",
                  causes: causes.length > 0 ? [...new Set(causes)].join(' | ') : "없음",
                  actions: actionLines.length > 0 ? actionLines.join(' | ') : displayMsg
                });
              }

              resolve({
                docType: 'sae',
                item: {
                  dtc: dtc,
                  displayMsg: displayMsg,
                  modelType: topData.modelType,
                  factory: topData.factory,
                  serialStart: topData.serialStart,
                  serialEnd: topData.serialEnd,
                  ecu: ecu,
                  paramName: paramName,
                  standard: standard,
                  fmiList: fmiList
                }
              });
            } else {
              // -------------------------------------------------------------
              // [ISO 엔진]
              // -------------------------------------------------------------
              let dtc = '';
              const dtcMatch = fullRawText.match(/([P|U|B|C][0-9A-Z]{5,7})/);
              if (dtcMatch) dtc = dtcMatch[1].replace(/\s+/g, '');

              function getLeftAnchorY(keyword, excludeKeyword) {
                const found = lines.find(l => {
                  const firstItem = l.items[0] || {};
                  if (firstItem.x > 70) return false;
                  const t = l.text.replace(/\s+/g, '');
                  if (excludeKeyword && t.includes(excludeKeyword)) return false;
                  return t.includes(keyword);
                });
                return found ? found.y : null;
              }

              const yECU = getLeftAnchorY('컨트롤유니트');
              const yComp = getLeftAnchorY('DTC코드', 'ISO') || getLeftAnchorY('고장유형', 'ISO') || getLeftAnchorY('구성부품', 'ISO');
              const yStd = getLeftAnchorY('기준', '고장');
              const yDiag = getLeftAnchorY('진단') || getLeftAnchorY('고장이벤트');
              
              const yEvent = getLeftAnchorY('고장이벤트');
              const ySym = getLeftAnchorY('증상');
              const yCond = getLeftAnchorY('조건');
              const yPre = getLeftAnchorY('선행조치');
              const yCause = getLeftAnchorY('가능한이유');
              const yAct = getLeftAnchorY('조치', '선행');
              const yEnd = (lines.find(l => l.text.includes('Guided Diagnostics') || l.text.includes('주석:')) || { y: 0 }).y;

              function extractRightContentInYBand(topY, bottomY, isBulletSection = true) {
                if (topY === null || bottomY === null) return isBulletSection ? '없음' : '-';
                const insideItems = allItems.filter(it => it.x >= 70 && it.y <= (topY + 4) && it.y > (bottomY + 4));
                if (insideItems.length === 0) return isBulletSection ? '없음' : '-';

                insideItems.sort((a, b) => (Math.abs(b.y - a.y) > 3.5 ? b.y - a.y : a.x - b.x));
                let bLines = [], currY = null, currLine = [];
                insideItems.forEach(it => {
                  if (currY === null || Math.abs(it.y - currY) > 3.5) {
                    if (currLine.length) bLines.push(currLine.join(' '));
                    currLine = [it.str];
                    currY = it.y;
                  } else {
                    currLine.push(it.str);
                  }
                });
                if (currLine.length) bLines.push(currLine.join(' '));

                if (!isBulletSection) return bLines.join(' ').replace(/^[¡○•●\s\-:]+/, '').trim() || '-';

                let bullets = [];
                bLines.forEach(l => {
                  let text = l.trim();
                  if (!text || text === '없음') return;
                  const cleaned = text.replace(/^[¡○•●\s\-:]+/, '').trim();
                  if (cleaned && cleaned !== '없음') bullets.push(cleaned);
                });
                return bullets.length > 0 ? [...new Set(bullets)].join(' | ') : '없음';
              }

              let ecu = '일반 용도 장비의 전자 컨트롤 유닛 1';
              if (yECU && yComp) ecu = extractRightContentInYBand(yECU, yComp, false);

              let compFull = dtc;
              if (yComp) {
                const bottomTarget = yStd || yDiag || (yComp - 30);
                compFull = extractRightContentInYBand(yComp, bottomTarget, false);
                if (compFull === '-' || !compFull) compFull = dtc;
              }

              let standard = '';
              if (yStd) {
                const bottomTarget = yDiag || yEvent || (yStd - 30);
                standard = extractRightContentInYBand(yStd, bottomTarget, false);
                if (standard === '-') standard = '';
              }

              let eventText = (yEvent && ySym) ? extractRightContentInYBand(yEvent, ySym, false) : '-';
              let symptomText = (ySym && yCond) ? extractRightContentInYBand(ySym, yCond, true) : '없음';
              let condText = (yCond && yPre) ? extractRightContentInYBand(yCond, yPre, true) : '없음';
              let preDtcText = '없음';
              if (yPre && yCause) {
                const rawPre = extractRightContentInYBand(yPre, yCause, true);
                if (rawPre && rawPre !== '없음') {
                  const codes = rawPre.match(/([P|U|B|C][0-9A-Z]{5,7})/g) || [];
                  const validCodes = codes.filter(c => c !== dtc && !c.startsWith('DTC'));
                  preDtcText = validCodes.length > 0 ? [...new Set(validCodes)].join(' | ') : (rawPre.includes('없음') ? '없음' : rawPre);
                }
              }
              let causesText = (yCause && yAct) ? extractRightContentInYBand(yCause, yAct, true) : '없음';
              let actionsText = yAct ? extractRightContentInYBand(yAct, yEnd, true) : '없음';

              resolve({
                docType: 'iso',
                item: {
                  dtc: dtc,
                  modelType: topData.modelType,
                  factory: topData.factory,
                  serialStart: topData.serialStart,
                  serialEnd: topData.serialEnd,
                  ecu: ecu,
                  compFull: compFull,
                  standard: standard,
                  event: eventText,
                  symptom: symptomText,
                  condition: condText,
                  preDtc: preDtcText,
                  causes: causesText,
                  actions: actionsText
                }
              });
            }
          } catch (err) { reject(err); }
        };
        reader.readAsArrayBuffer(file);
      });
    }

    // =========================================================================
    // [Turso DB 저장]
    // =========================================================================
    async function saveAllToTursoDb() {
      if (parsedResults.length === 0) return;
      const btn = document.getElementById('btnSaveAll');
      const dupPolicy = document.querySelector('input[name="dupPolicy"]:checked').value;
      btn.disabled = true;

      let targetItems = parsedResults;
      if (dupPolicy === 'skip') {
        targetItems = parsedResults.filter(r => r._dupStatus === 'NEW' || r._dupStatus === 'VARIANT_NEW');
        if (targetItems.length === 0) { alert('저장할 신규 항목이 없습니다.'); btn.disabled = false; return; }
      }

      showStatus(`Turso DB에 ${targetItems.length}건 정밀 저장 중...`, 'loading');

      const requestsBatch = targetItems.map(item => {
        const isSae = item.docType === 'sae';
        const contentObj = { ...item };
        delete contentObj._dupStatus;

        const searchText = [
          item.dtc,
          item.ecu,
          item.compFull || item.paramName,
          item.displayMsg || '',
          item.standard || '',
          item.event || '',
          item.symptom || '',
          item.causes || '',
          item.actions || '',
          isSae ? (item.fmiList || []).map(f => `${f.fmi} ${f.cond} ${f.symptom} ${f.causes} ${f.actions}`).join(' ') : ''
        ].join(' ');

        return {
          type: "execute",
          stmt: {
            sql: `
              INSERT INTO diagnostics (dtc, doc_type, ecu, comp_name, search_text, content_json, updated_at)
              VALUES (?, ?, ?, ?, ?, ?, CURRENT_TIMESTAMP)
              ON CONFLICT(dtc) DO UPDATE SET
                doc_type=excluded.doc_type,
                ecu=excluded.ecu,
                comp_name=excluded.comp_name,
                search_text=excluded.search_text,
                content_json=excluded.content_json,
                updated_at=CURRENT_TIMESTAMP;
            `,
            args: [
              { type: "text", value: String(item.dtc || '') },
              { type: "text", value: String(item.docType || 'iso').toUpperCase() },
              { type: "text", value: String(item.ecu || '-') },
              { type: "text", value: String(item.compFull || item.paramName || item.dtc) },
              { type: "text", value: searchText },
              { type: "text", value: JSON.stringify(contentObj) }
            ]
          }
        };
      });

      try {
        const res = await fetch(`${TURSO_DB_URL}/v2/pipeline`, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${TURSO_ADMIN_TOKEN}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ requests: requestsBatch })
        });

        if (res.ok) {
          await fetchExistingDb();
          showStatus(`🎉 총 ${targetItems.length}건의 진단서가 Turso DB에 정상 저장되었습니다!`, 'success');
        } else {
          showStatus(`❌ 저장 실패 (HTTP ${res.status})`, 'error');
        }
      } catch (err) {
        showStatus(`❌ 에러: ${err.message}`, 'error');
      }

      btn.disabled = false;
    }

    function addQueueItemUI(idx, name) {
      const qList = document.getElementById('queueList');
      const div = document.createElement('div');
      div.id = `qItem_${idx}`; 
      div.className = 'queue-item processing';
      div.innerHTML = `<span>📄 ${name}</span><span class="status-badge">분석 중...</span>`;
      qList.appendChild(div);
    }

    function updateQueueStatus(idx, msg, type) {
      const el = document.getElementById(`qItem_${idx}`);
      if (el) { 
        el.className = `queue-item ${type}`; 
        el.querySelector('.status-badge').innerText = msg; 
      }
    }

    function addSummaryRow(d) {
      const tbody = document.getElementById('summaryBody');
      const tr = document.createElement('tr');
      let tabBadge = (d.docType === 'sae') ? '<span class="badge badge-sae">SAE</span>' : '<span class="badge badge-iso">ISO</span>';
      let dupBadge = '<span class="badge badge-new">🟢 신규 등록</span>';
      if (d._dupStatus === 'VARIANT_NEW') dupBadge = '<span class="badge badge-variant">🟡 변종 (별도저장)</span>';
      else if (d._dupStatus === 'EXACT_DUP') dupBadge = '<span class="badge badge-dup">🟠 기존 덮어쓰기</span>';

      const isOpt = String(d.factory || '').startsWith('[옵션]');
      let serialInfo = '';
      if (isOpt) {
        serialInfo = `<br><span style="font-size:11px; color:#0284c7;">${d.factory} : ${d.serialStart}</span>`;
      } else if (d.factory || d.serialStart || d.serialEnd) {
        serialInfo = `<br><span style="font-size:11px; color:#0284c7;">[${d.factory || '-'}] #${d.serialStart || '시작'}~${d.serialEnd || '종료'}</span>`;
      }

      let detailText = (d.docType === 'sae') ? `<b>${d.paramName || ''}</b><br><span style="color:#64748b;">(FMI ${(d.fmiList||[]).length}개 모드)</span>` : (d.compFull || d.event || '-');

      tr.innerHTML = `<td>${tabBadge}</td><td><b>${d.dtc}</b></td><td><b>${d.modelType || 'Volvo'}</b>${serialInfo}</td><td>${detailText}</td><td>${dupBadge}</td>`;
      tbody.appendChild(tr);
    }

    function clearQueue() {
      parsedResults = [];
      document.getElementById('queueList').innerHTML = ''; 
      document.getElementById('summaryBody').innerHTML = '';
      document.getElementById('parsedCount').innerText = '0'; 
      document.getElementById('btnSaveAll').disabled = true;
      document.getElementById('queueCard').style.display = 'none'; 
      document.getElementById('status').textContent = ''; 
      document.getElementById('fileInput').value = '';
    }

    function showStatus(msg, type) { 
      const el = document.getElementById('status'); 
      el.textContent = msg; 
      el.className = 'status ' + type; 
    }
  </script>
