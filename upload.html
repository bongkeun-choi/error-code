<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>볼보 진단 매뉴얼 - JSON 업로더 & 관리자</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #0284c7;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --bg: #f8fafc;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: #1e293b; padding-bottom: 60px; }
    .header { background: var(--primary); color: white; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
    .header a { color: #93c5fd; text-decoration: none; font-size: 13px; font-weight: bold; }
    .container { max-width: 1140px; margin: 20px auto; padding: 0 16px; }

    .drop-zone { border: 2.5px dashed var(--accent); background: #f0f9ff; border-radius: 12px; padding: 32px 20px; text-align: center; cursor: pointer; transition: 0.2s; }
    .drop-zone:hover, .drop-zone.dragover { background: #e0f2fe; border-color: #0369a1; }
    .drop-zone h3 { font-size: 18px; color: #0369a1; margin-bottom: 6px; }

    .summary-box { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
    .summary-card { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; }
    .summary-card b { font-size: 20px; display: block; margin-top: 4px; }
    .card-new { border-left: 5px solid var(--success); color: var(--success); }
    .card-dup { border-left: 5px solid var(--warning); color: var(--warning); }
    .card-total { border-left: 5px solid var(--accent); color: var(--accent); }

    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .btn { padding: 10px 16px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; border: none; }
    .btn-upload { background: var(--accent); color: white; }
    .btn-upload:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-clear { background: #e2e8f0; color: #475569; }

    .tbl-container { background: white; border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; text-align: left; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { background: #f1f5f9; font-weight: bold; color: #475569; }
    
    .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; }
    .badge-new { background: #dcfce7; color: #15803d; }
    .badge-dup { background: #fef3c7; color: #b45309; }

    .btn-preview { background: #f8fafc; border: 1px solid #cbd5e1; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; }
    .progress-wrap { display: none; margin-top: 14px; background: #e2e8f0; border-radius: 8px; height: 16px; overflow: hidden; }
    .progress-bar { height: 100%; width: 0%; background: var(--success); transition: width 0.2s; }

    /* JSON 모달 */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .modal-box { background: white; width: 100%; max-width: 800px; max-height: 85vh; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .modal-header { padding: 14px 20px; background: var(--primary); color: white; display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 20px; overflow-y: auto; flex: 1; font-family: monospace; font-size: 13px; background: #0f172a; color: #38bdf8; white-space: pre-wrap; }
  </style>
</head>
<body>

  <div class="header">
    <h2>🚜 볼보 진단서 차세대 JSON 업로더</h2>
    <a href="index.html">🔍 검색 뷰어로 이동 ➔</a>
  </div>

  <div class="container">
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <h3>📁 PDF 파일을 여기에 끌어다 놓거나 클릭하여 선택</h3>
      <p>단일/다중 페이지 PDF를 완벽한 구조화 JSON 데이터로 자동 패키징합니다.</p>
      <input type="file" id="fileInput" multiple accept=".pdf" style="display:none;" onchange="handleFiles(this.files)">
    </div>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="summary-box" id="summaryBox" style="display:none;">
      <div class="summary-card card-total">분석된 파일<b id="cntTotal">0</b></div>
      <div class="summary-card card-new">신규 고장코드<b id="cntNew">0</b></div>
      <div class="summary-card card-dup">기존 존재 (덮어쓰기)<b id="cntDup">0</b></div>
    </div>

    <div class="toolbar" id="toolbar" style="display:none;">
      <div>
        <label><input type="checkbox" id="checkAll" checked onchange="toggleSelectAll(this.checked)"> 전체 선택/해제</label>
        <span id="selectedInfo" style="margin-left: 10px; font-size: 13px; color: #64748b;"></span>
      </div>
      <div>
        <button class="btn btn-clear" onclick="resetList()">목록 초기화</button>
        <button class="btn btn-upload" id="uploadBtn" onclick="startUpload()">⚡ Turso DB로 JSON 일괄 적재</button>
      </div>
    </div>

    <div class="tbl-container" id="tblBox" style="display:none;">
      <table>
        <thead>
          <tr>
            <th style="width:40px;">선택</th>
            <th>상태</th>
            <th>고장코드</th>
            <th>규격</th>
            <th>컨트롤 유니트</th>
            <th>구성부품 / 고장유형</th>
            <th>구조화 데이터 미리보기</th>
            <th>업로드 상태</th>
          </tr>
        </thead>
        <tbody id="fileListBody"></tbody>
      </table>
    </div>
  </div>

  <!-- JSON 뷰어 모달 -->
  <div class="modal-overlay" id="jsonModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalTitle">구조화 JSON 미리보기</h3>
        <button style="background:none; border:none; color:white; font-size:18px; cursor:pointer;" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalJsonContent"></div>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const TURSO_DB_URL = "https://volvoerror-bongkeun-choi.aws-ap-northeast-1.turso.io";
    const TURSO_ADMIN_TOKEN = "eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODcwOTA3MDQsImlkIjoiMDFhMDE1M2QtNDAwMS03OWU4LTlmYWUtNWJmZDMyZjcyMGE3Iiwia2lkIjoicEo1RHFMd2V3dHJZLTBXWGNxRTd0cnVRNWxrWDlYOVFJNTYxZl9lSC1YTSIsInJpZCI6IjY1YmYwM2JjLTc1ZmEtNGQ1NC05MzY0LWFhNjYzNjRlNzZjNyJ9.O2P-wN5MFUe6jCbxxxSrvtMZt_MyTyavApqJ-2se7NwSgCbi1byQezjfr6Ba49TWcou0Cg4hBq1xUOg7DAVSBg";

    let parsedItems = [];

    const dropZone = document.getElementById('dropZone');
    ['dragenter', 'dragover'].forEach(e => dropZone.addEventListener(e, (evt) => { evt.preventDefault(); dropZone.classList.add('dragover'); }));
    ['dragleave', 'drop'].forEach(e => dropZone.addEventListener(e, (evt) => { evt.preventDefault(); dropZone.classList.remove('dragover'); }));
    dropZone.addEventListener('drop', (evt) => {
      evt.preventDefault();
      if (evt.dataTransfer.files) handleFiles(evt.dataTransfer.files);
    });

    async function extractStructuredPdf(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const textLines = [];

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const textContent = await page.getTextContent();
        const viewport = page.getViewport({ scale: 1.0 });

        const items = textContent.items.map(item => ({
          str: item.str,
          x: item.transform[4],
          y: viewport.height - item.transform[5]
        })).filter(item => item.str.trim().length > 0);

        items.sort((a, b) => a.y - b.y || a.x - b.x);

        let currentLine = [];
        let lastY = -999;

        items.forEach(item => {
          if (Math.abs(item.y - lastY) > 5.0) {
            if (currentLine.length > 0) {
              currentLine.sort((a, b) => a.x - b.x);
              textLines.push(currentLine.map(w => w.str.trim()).join(' '));
            }
            currentLine = [item];
            lastY = item.y;
          } else {
            currentLine.push(item);
          }
        });
        if (currentLine.length > 0) {
          currentLine.sort((a, b) => a.x - b.x);
          textLines.push(currentLine.map(w => w.str.trim()).join(' '));
        }
      }

      return buildVolvoJson(textLines, file.name);
    }

    function buildVolvoJson(lines, filename) {
      let dtc = filename.replace(/\.pdf$/i, '').trim();
      let docType = "ISO";
      let ecu = "";
      let compName = "";
      let standard = "";
      let event = "";
      let symptoms = [];
      let conditions = [];
      let preDtcs = [];
      let causes = [];
      let actions = [];
      let specs = [];

      let currentSlot = null;

      const labelMap = [
        { key: 'SPECS_SERIAL', re: /^일련\s*번호에\s*대해/ },
        { key: 'SPECS_OPT', re: /^옵션\/구성/ },
        { key: 'ECU', re: /^컨트롤\s*유니트\s*[:]?/ },
        { key: 'COMP', re: /^(?:DTC\s*코드[,\s]*시스템[/\s]*구성부품[,\s]*고장\s*유형|고장\s*유형|구성부품)\s*[:]?/ },
        { key: 'STD', re: /^기준\s*[:]?/ },
        { key: 'EVENT', re: /^고장\s*이벤트\s*[:]?/ },
        { key: 'SYMPTOM', re: /^증상\s*[:]?/ },
        { key: 'COND', re: /^조건\s*[:]?/ },
        { key: 'PRE_DTC', re: /^선행조치\s*DTC[^)]*\)?\s*[:]?|^선행조치\s*[:]?/ },
        { key: 'CAUSES', re: /^가능한\s*이유\s*[:]?/ },
        { key: 'ACTIONS', re: /^조치\s*[:]?/ },
        { key: 'DIAG_HEADER', re: /^진단$/ },
        { key: 'FOOTER', re: /^Guided\s*Diagnostics/ }
      ];

      for (const line of lines) {
        if (!line || line === '모든 프로필 표시' || line === 'ISO DTC 코드') continue;

        const dtcMatch = line.match(/^([P|U|B|C][0-9A-Z]{5,7})$/i);
        if (dtcMatch && !currentSlot) {
          dtc = dtcMatch[1].toUpperCase();
          continue;
        }

        let matched = null;
        let rest = line;

        for (const p of labelMap) {
          const m = line.match(p.re);
          if (m) {
            matched = p.key;
            rest = line.substring(m[0].length).trim();
            break;
          }
        }

        if (matched) {
          currentSlot = matched;
          if (matched === 'DIAG_HEADER' || matched === 'FOOTER') continue;
          if (rest) pushData(currentSlot, rest);
          continue;
        }

        if (currentSlot && currentSlot !== 'FOOTER' && currentSlot !== 'DIAG_HEADER') {
          pushData(currentSlot, line);
        }
      }

      function pushData(slot, text) {
        text = text.trim();
        if (!text) return;
        const cleanB = (t) => t.replace(/^[¡○•●\-\s:]+/, '').trim();

        if (slot === 'SPECS_SERIAL') {
          const m = text.match(/(Changwon|Shanghai|창원|상하이)\s+(\d{4,8})\s+(\d{4,8})/i);
          if (m) specs.push({ type: "SERIAL", model: "EC300E L Volvo", factory: m[1], start: m[2], end: m[3] });
        } else if (slot === 'SPECS_OPT') {
          const m = text.match(/(\d{6,8})\s+([A-Za-z0-9\s]+?)\s+(Volvo\s+Active\s+Control|[A-Za-z0-9\s]+)/i);
          if (m) specs.push({ type: "OPTION", model: "EC300E L Volvo", opt_no: m[1], opt_name: m[2].trim(), opt_config: m[3].trim() });
        } else if (slot === 'ECU') {
          ecu = (ecu ? ecu + ' ' : '') + text;
        } else if (slot === 'COMP') {
          compName = (compName ? compName + ' ' : '') + text;
        } else if (slot === 'STD') {
          if (text !== '진단') standard = (standard ? standard + ' ' : '') + text;
        } else if (slot === 'EVENT') {
          event = (event ? event + ' ' : '') + cleanB(text);
        } else if (slot === 'SYMPTOM') {
          if (/^[¡○•●]/.test(text) || symptoms.length === 0) symptoms.push(cleanB(text));
          else symptoms[symptoms.length - 1] += ' ' + text;
        } else if (slot === 'COND') {
          if (/^[¡○•●]/.test(text) || conditions.length === 0) conditions.push(cleanB(text));
          else conditions[conditions.length - 1] += ' ' + text;
        } else if (slot === 'PRE_DTC') {
          const found = text.match(/([P|U|B|C][0-9A-Z]{5,7})/g);
          if (found) preDtcs.push(...found);
        } else if (slot === 'CAUSES') {
          if (/^[¡○•●]/.test(text) || causes.length === 0) causes.push(cleanB(text));
          else causes[causes.length - 1] += ' ' + text;
        } else if (slot === 'ACTIONS') {
          if (/^[¡○•●]/.test(text) || actions.length === 0) actions.push(cleanB(text));
          else actions[actions.length - 1] += ' ' + text;
        }
      }

      const validPreDtcs = [...new Set(preDtcs)].filter(c => c !== dtc && !c.startsWith('DTC'));

      const contentObj = {
        specs: specs.length > 0 ? specs : [{ type: "SERIAL", model: "EC300E L Volvo", factory: "Changwon", start: "310001", end: "320000" }],
        standard: standard.trim(),
        event: event.trim() || "-",
        symptoms: symptoms.filter(s => s && s !== '없음'),
        conditions: conditions.filter(s => s && s !== '없음'),
        pre_dtc: validPreDtcs,
        causes: causes.filter(s => s && s !== '없음'),
        actions: actions.filter(s => s && s !== '없음')
      };

      const searchText = [
        dtc, ecu, compName, standard, event,
        ...contentObj.symptoms, ...contentObj.causes, ...contentObj.actions
      ].join(' ');

      return {
        filename,
        dtc: dtc.toUpperCase(),
        doc_type: docType,
        ecu: ecu.trim() || "일반 용도 장비의 전자 컨트롤 유닛 1",
        comp_name: compName.trim() || dtc,
        search_text: searchText,
        content_json: JSON.stringify(contentObj, null, 2),
        contentObj,
        selected: true,
        status: "NEW"
      };
    }

    async function handleFiles(files) {
      if (!files || files.length === 0) return;

      document.getElementById('summaryBox').style.display = 'grid';
      document.getElementById('toolbar').style.display = 'flex';
      document.getElementById('tblBox').style.display = 'block';

      for (const file of files) {
        if (!file.name.toLowerCase().endsWith('.pdf')) continue;
        try {
          const item = await extractStructuredPdf(file);
          parsedItems.push(item);
        } catch (e) {
          console.error("파싱 실패:", file.name, e);
        }
      }

      await checkDuplicates();
      renderTable();
    }

    async function checkDuplicates() {
      if (parsedItems.length === 0) return;
      const dtcs = parsedItems.map(i => `'${i.dtc}'`).join(',');
      const sql = `SELECT dtc FROM diagnostics WHERE dtc IN (${dtcs});`;

      try {
        const res = await fetch(`${TURSO_DB_URL}/v2/pipeline`, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${TURSO_ADMIN_TOKEN}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ requests: [{ type: "execute", stmt: { sql } }] })
        });
        const data = await res.json();
        const existingSet = new Set();

        const result = data.results[0]?.response?.result;
        if (result && result.rows) {
          result.rows.forEach(r => existingSet.add(r[0].value));
        }

        parsedItems.forEach(item => {
          item.status = existingSet.has(item.dtc) ? "DUPLICATE" : "NEW";
        });
      } catch (e) {
        console.error("DB 중복 체크 에러:", e);
      }
    }

    function renderTable() {
      const tbody = document.getElementById('fileListBody');
      tbody.innerHTML = '';

      let cntNew = 0, cntDup = 0;

      parsedItems.forEach((item, idx) => {
        if (item.status === 'NEW') cntNew++;
        else cntDup++;

        const isDup = item.status === 'DUPLICATE';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><input type="checkbox" ${item.selected ? 'checked' : ''} onchange="toggleItem(${idx}, this.checked)"></td>
          <td>${isDup ? '<span class="badge badge-dup">⚠️ 덮어쓰기</span>' : '<span class="badge badge-new">🟢 신규</span>'}</td>
          <td><b style="color:var(--danger); font-size:14px;">${item.dtc}</b></td>
          <td><span class="badge" style="background:#e0f2fe; color:#0369a1;">${item.doc_type}</span></td>
          <td>${item.ecu}</td>
          <td>${item.comp_name}</td>
          <td><button class="btn-preview" onclick="openJsonModal(${idx})">📋 JSON 보기</button></td>
          <td id="status_${idx}" style="font-weight:bold; color:#64748b;">대기 중</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('cntTotal').innerText = parsedItems.length;
      document.getElementById('cntNew').innerText = cntNew;
      document.getElementById('cntDup').innerText = cntDup;
      document.getElementById('selectedInfo').innerText = `총 ${parsedItems.length}개 파일 준비 완료`;
    }

    function toggleSelectAll(checked) {
      parsedItems.forEach(i => i.selected = checked);
      renderTable();
    }

    function toggleItem(idx, checked) {
      parsedItems[idx].selected = checked;
    }

    function resetList() {
      parsedItems = [];
      document.getElementById('summaryBox').style.display = 'none';
      document.getElementById('toolbar').style.display = 'none';
      document.getElementById('tblBox').style.display = 'none';
      document.getElementById('fileInput').value = '';
    }

    function openJsonModal(idx) {
      const item = parsedItems[idx];
      document.getElementById('modalTitle').innerText = `[${item.dtc}] 구조화 JSON 데이터`;
      document.getElementById('modalJsonContent').innerText = item.content_json;
      document.getElementById('jsonModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('jsonModal').style.display = 'none';
    }

    async function startUpload() {
      const targets = parsedItems.filter(i => i.selected);
      if (targets.length === 0) {
        alert("업로드할 항목을 선택해 주세요.");
        return;
      }

      const btn = document.getElementById('uploadBtn');
      btn.disabled = true;
      btn.innerText = "⏳ Turso DB 적재 중...";

      const progressWrap = document.getElementById('progressWrap');
      const progressBar = document.getElementById('progressBar');
      progressWrap.style.display = 'block';
      progressBar.style.width = '0%';

      let successCount = 0;

      for (let i = 0; i < targets.length; i++) {
        const item = targets[i];
        const originalIdx = parsedItems.indexOf(item);
        const statusTd = document.getElementById(`status_${originalIdx}`);
        statusTd.innerText = "전송 중...";
        statusTd.style.color = "var(--accent)";

        const payload = {
          requests: [{
            type: "execute",
            stmt: {
              sql: `
                INSERT INTO diagnostics (dtc, doc_type, ecu, comp_name, search_text, content_json, updated_at)
                VALUES (?, ?, ?, ?, ?, ?, CURRENT_TIMESTAMP)
                ON CONFLICT(dtc) DO UPDATE SET
                  doc_type=excluded.doc_type,
                  ecu=excluded.ecu,
                  comp_name=excluded.comp_name,
                  search_text=excluded.search_text,
                  content_json=excluded.content_json,
                  updated_at=CURRENT_TIMESTAMP;
              `,
              args: [
                { type: "text", value: item.dtc },
                { type: "text", value: item.doc_type },
                { type: "text", value: item.ecu },
                { type: "text", value: item.comp_name },
                { type: "text", value: item.search_text },
                { type: "text", value: item.content_json }
              ]
            }
          }]
        };

        try {
          const res = await fetch(`${TURSO_DB_URL}/v2/pipeline`, {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${TURSO_ADMIN_TOKEN}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
          });

          if (res.ok) {
            statusTd.innerText = "✅ 적재 완료";
            statusTd.style.color = "var(--success)";
            successCount++;
          } else {
            statusTd.innerText = "❌ 실패";
            statusTd.style.color = "var(--danger)";
          }
        } catch (e) {
          statusTd.innerText = "❌ 에러";
          statusTd.style.color = "var(--danger)";
        }

        const pct = Math.round(((i + 1) / targets.length) * 100);
        progressBar.style.width = `${pct}%`;
      }

      btn.disabled = false;
      btn.innerText = "⚡ Turso DB로 JSON 일괄 적재";
