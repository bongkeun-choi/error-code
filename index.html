<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>볼보에러 - Turso Edge 뷰어</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, sans-serif; }
    body { background: #f1f5f9; color: #0f172a; padding-bottom: 60px; }
    .header { background: #0f172a; color: white; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
    .container { max-width: 860px; margin: 20px auto; padding: 0 14px; }
    .search-input { width: 100%; padding: 14px 16px; font-size: 16px; font-weight: bold; border: 2px solid #94a3b8; border-radius: 10px; outline: none; }
    .search-input:focus { border-color: #0284c7; }
    .status { font-size: 13px; color: #64748b; font-weight: bold; margin: 10px 0 16px; }
    .status.error { color: #dc2626; background: #fee2e2; padding: 10px; border-radius: 8px; border: 1px solid #fca5a5; }
    .status.ok { color: #0284c7; }
    .card { background: white; border: 1.5px solid #cbd5e1; border-radius: 12px; margin-bottom: 14px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    .card-header { padding: 14px 16px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
    .badge-dtc { background: #dc2626; color: white; padding: 3px 8px; border-radius: 4px; font-weight: 900; font-size: 13px; }
    .oem-sheet { padding: 20px; background: white; font-size: 13px; }
    .oem-tbl { width: 100%; border-collapse: collapse; border: 1.5px solid #000; margin-bottom: 12px; }
    .oem-tbl th, .oem-tbl td { border: 1px solid #000; padding: 6px 8px; vertical-align: top; }
    .oem-tbl th { background: #e2e8f0; font-weight: bold; text-align: left; }
    .bullet { margin-bottom: 3px; display: flex; gap: 6px; }
  </style>
</head>
<body>
  <div class="header"><h2>🚜 볼보 진단 매뉴얼 (Turso Edge)</h2></div>
  <div class="container">
    <input type="text" id="searchInput" class="search-input" placeholder="고장코드 검색 (예: 2311, B102311, U114600, PID45)..." oninput="onSearch()">
    <div class="status" id="status">검색어를 2글자 이상 입력하세요.</div>
    <div id="results"></div>
  </div>

  <script>
    const TURSO_URL = "https://volvoerror-bongkeun-choi.aws-ap-northeast-1.turso.io/v2/pipeline";
    const TURSO_READ_TOKEN = "eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODcwOTA3MDQsImlkIjoiMDFhMDE1M2QtNDAwMS03OWU4LTlmYWUtNWJmZDMyZjcyMGE3Iiwia2lkIjoicEo1RHFMd2V3dHJZLTBXWGNxRTd0cnVRNWxrWDlYOVFJNTYxZl9lSC1YTSIsInJpZCI6IjY1YmYwM2JjLTc1ZmEtNGQ1NC05MzY0LWFhNjYzNjRlNzZjNyJ9.O2P-wN5MFUe6jCbxxxSrvtMZt_MyTyavApqJ-2se7NwSgCbi1byQezjfr6Ba49TWcou0Cg4hBq1xUOg7DAVSBg";

    async function queryTurso(sql, args = []) {
      const payload = {
        requests: [{
          type: "execute",
          stmt: {
            sql: sql,
            args: args.map(a => ({ type: "text", value: String(a) }))
          }
        }]
      };

      const res = await fetch(TURSO_URL, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${TURSO_READ_TOKEN}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`[HTTP ${res.status}] ${errText}`);
      }

      const data = await res.json();
      if (!data.results || data.results.length === 0) return [];

      const firstRes = data.results[0];
      if (firstRes.type === "error") {
        throw new Error(`[SQL 오류] ${firstRes.error?.message || JSON.stringify(firstRes.error)}`);
      }

      const result = firstRes.response?.result;
      if (!result) return [];

      const cols = (result.cols || []).map(c => c.name);
      return (result.rows || []).map(row => {
        let obj = {};
        row.forEach((cell, i) => { obj[cols[i]] = cell?.value ?? null; });
        return obj;
      });
    }

    let searchTimer = null;
    function onSearch() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(async () => {
        const q = document.getElementById('searchInput').value.trim();
        const statusEl = document.getElementById('status');
        const resultsEl = document.getElementById('results');

        if (q.length < 2) {
          resultsEl.innerHTML = '';
          statusEl.className = 'status';
          statusEl.innerText = '검색어를 2글자 이상 입력하세요.';
          return;
        }

        statusEl.className = 'status ok';
        statusEl.innerText = '⚡ Turso Edge DB 검색 중...';
        const start = performance.now();

        try {
          const items = await queryTurso(
            "SELECT * FROM diagnostics WHERE dtc LIKE ? OR comp_name LIKE ? LIMIT 10", 
            [`%${q}%`, `%${q}%`]
          );
          
          const elapsed = (performance.now() - start).toFixed(1);
          statusEl.className = 'status ok';
          statusEl.innerText = `검색 완료 (${items.length}건, ${elapsed}ms)`;

          renderResults(items);
        } catch (err) {
          statusEl.className = 'status error';
          statusEl.innerHTML = `⚠️ <b>오류 원인:</b> ${err.message}`;
          resultsEl.innerHTML = '';
        }
      }, 150);
    }

    async function renderResults(items) {
      const box = document.getElementById('results');
      box.innerHTML = '';

      if (items.length === 0) {
        box.innerHTML = '<div style="text-align:center; padding:40px; color:#64748b;">일치하는 진단 데이터가 없습니다.</div>';
        return;
      }

      for (const d of items) {
        let specs = [];
        try {
          specs = await queryTurso("SELECT * FROM diagnostic_specs WHERE dtc = ?", [d.dtc]);
        } catch(e) { console.warn(e); }

        let optRows = specs.filter(s => s.spec_type === 'OPTION').map(s => `<tr><td>${s.model_type || '-'}</td><td>${s.opt_number || '-'}</td><td>${s.opt_name || '-'}</td><td>${s.opt_config || '-'}</td></tr>`).join('');
        let serialRows = specs.filter(s => s.spec_type === 'SERIAL').map(s => `<tr><td>${s.model_type || '-'}</td><td>${s.factory || '-'}</td><td>${s.serial_start || '-'}</td><td>${s.serial_end || '-'}</td></tr>`).join('');

        let topTablesHtml = '';
        if (optRows) topTablesHtml += `<table class="oem-tbl"><tr><th colspan="4">옵션/구성에 대해 유효</th></tr><tr style="background:#f8fafc; font-weight:bold;"><td>모델 종류:</td><td>옵션 번호</td><td>옵션</td><td>구성</td></tr>${optRows}</table>`;
        if (serialRows) topTablesHtml += `<table class="oem-tbl"><tr><th colspan="4">일련 번호에 대해 유효</th></tr><tr style="background:#f8fafc; font-weight:bold;"><td>모델 종류:</td><td>생산 사업장</td><td>일련 번호 시작</td><td>일련 번호 종료</td></tr>${serialRows}</table>`;

        const renderBullets = (str) => {
          if (!str || str === '없음') return '<div class="bullet"><span>○</span><span>없음</span></div>';
          return str.split('|').map(s => `<div class="bullet"><span>○</span><span>${s.trim()}</span></div>`).join('');
        };

        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <div class="card-header">
            <div><span class="badge-dtc">${d.dtc}</span> <b style="margin-left:8px;">${d.comp_name || ''}</b></div>
            <div><span style="font-size:12px; font-weight:bold; color:#0284c7;">[${d.doc_type}]</span></div>
          </div>
          <div class="oem-sheet">
            <h2 style="margin-bottom:12px;">${d.dtc}</h2>
            ${topTablesHtml}
            <table class="oem-tbl">
              <tr><th style="width:30%;">컨트롤 유니트</th><td>${d.ecu || '-'}</td></tr>
              <tr><th>DTC 코드, 시스템/구성부품, 고장 유형</th><td><b>${d.comp_name || d.dtc}</b></td></tr>
              ${d.standard ? `<tr><th>기준</th><td>${d.standard}</td></tr>` : ''}
            </table>
            <table class="oem-tbl">
              <tr><th style="width:30%;">고장 이벤트</th><td>${d.event || '-'}</td></tr>
              <tr><th>증상</th><td>${renderBullets(d.symptom)}</td></tr>
              <tr><th>조건</th><td>${renderBullets(d.condition)}</td></tr>
              <tr><th>선행조치 DTC</th><td>${renderBullets(d.pre_dtc)}</td></tr>
              <tr><th>가능한 이유</th><td>${renderBullets(d.causes)}</td></tr>
              <tr><th>조치</th><td>${renderBullets(d.actions)}</td></tr>
            </table>
          </div>
        `;
        box.appendChild(div);
      }
    }
  </script>
</body>
</html>
